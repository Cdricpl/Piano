<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mp-fond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="mp-touche" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e7e9f8"/></linearGradient>
    <linearGradient id="mp-noire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f63"/><stop offset="1" stop-color="#1d2036"/></linearGradient>
    <clipPath id="mp-forme"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#mp-fond)"/>
  <!-- reflet -->
  <circle cx="420" cy="70" r="230" fill="#fff" opacity=".14" clip-path="url(#mp-forme)"/>
  <!-- ombre portée -->
  <rect x="82" y="196" width="348" height="250" rx="34" fill="#2a0f6b" opacity=".28"/>
  <!-- touches blanches -->
  <rect x="72" y="176" width="368" height="250" rx="34" fill="url(#mp-touche)"/>
  <g stroke="#c9cce6" stroke-width="5" stroke-linecap="round">
    <line x1="133" y1="300" x2="133" y2="420"/><line x1="195" y1="300" x2="195" y2="420"/><line x1="256" y1="300" x2="256" y2="420"/>
    <line x1="317" y1="300" x2="317" y2="420"/><line x1="379" y1="300" x2="379" y2="420"/>
  </g>
  <!-- touches noires -->
  <g fill="url(#mp-noire)">
    <rect x="113" y="176" width="40" height="150" rx="10"/><rect x="175" y="176" width="40" height="150" rx="10"/>
    <rect x="297" y="176" width="40" height="150" rx="10"/><rect x="359" y="176" width="40" height="150" rx="10"/>
  </g>
  <!-- croche -->
  <g fill="#fff">
    <ellipse cx="184" cy="120" rx="30" ry="22" transform="rotate(-20 184 120)"/>
    <rect x="206" y="44" width="12" height="82" rx="6"/>
    <path d="M206 44c6 26 40 32 52 66-18-12-34-14-52-14z"/>
  </g>
  <!-- touche jouée -->
  <rect x="197" y="326" width="56" height="96" rx="14" fill="#fff" opacity="0"/>
</svg>
